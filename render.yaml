services:
  # Backend API Service
  - type: web
    name: mushagashe-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@mushagashe.edu
      - key: ADMIN_PASSWORD
        value: admin123
      - key: FRONTEND_URL
        value: "*"
      - key: DB_PATH
        value: /opt/render/project/backend/database/mushagashe.db
    disk:
      name: data
      mountPath: /opt/render/project/backend/database
      sizeGB: 1
