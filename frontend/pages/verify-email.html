<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Mushagashe Vocational Training Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/design-system.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
        .verify-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--primary-50) 0%, var(--surface) 50%, var(--accent-50) 100%);
        }

        .verify-header {
            padding: var(--space-6) var(--space-8);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-text h1 {
            font-size: var(--text-base);
            font-weight: var(--font-bold);
            color: var(--text-primary);
            line-height: var(--leading-tight);
        }

        .logo-text p {
            font-size: var(--text-xs);
            color: var(--text-secondary);
        }

        .verify-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-12) var(--space-8);
        }

        .verify-container {
            max-width: 480px;
            width: 100%;
        }

        .verify-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            padding: var(--space-8);
            text-align: center;
        }

        .verify-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--space-6);
            background: linear-gradient(135deg, var(--success-400), var(--success-600));
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .verify-icon.error {
            background: linear-gradient(135deg, var(--danger-400), var(--danger-600));
        }

        .verify-title {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--text-primary);
            margin-bottom: var(--space-3);
        }

        .verify-message {
            font-size: var(--text-base);
            color: var(--text-secondary);
            margin-bottom: var(--space-6);
            line-height: var(--leading-relaxed);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-3) var(--space-6);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
            font-weight: var(--font-semibold);
            text-decoration: none;
            transition: all var(--transition-base);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-600), var(--primary-800));
            color: var(--text-inverse);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .verify-footer {
            padding: var(--space-6) var(--space-8);
            background: var(--gray-50);
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .footer-text {
            font-size: var(--text-sm);
            color: var(--text-secondary);
        }

        @media (max-width: 640px) {
            .verify-header {
                padding: var(--space-4) var(--space-6);
            }

            .verify-main {
                padding: var(--space-8) var(--space-6);
            }

            .verify-card {
                padding: var(--space-6);
            }

            .verify-title {
                font-size: var(--text-xl);
            }
        }
    </style>
</head>
<body>
    <div class="verify-page">
        <header class="verify-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <img src="../assets/images/mushagashe-logo.jpg" alt="Mushagashe VTC Logo">
                    </div>
                    <div class="logo-text">
                        <h1>Mushagashe VTC</h1>
                        <p>Student Portal</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="verify-main">
            <div class="verify-container">
                <div class="verify-card">
                    <div id="verifyIcon" class="verify-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <h2 id="verifyTitle" class="verify-title">Verifying your email...</h2>
                    <p id="verifyMessage" class="verify-message">Please wait while we verify your email address.</p>
                    <a id="loginButton" href="student-login.html" class="btn btn-primary" style="display: none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                        Go to Login
                    </a>
                </div>
            </div>
        </main>

        <footer class="verify-footer">
            <p class="footer-text">Mushagashe Vocational Training Centre</p>
            <p class="footer-text">&copy; <span id="current-year"></span> All Rights Reserved</p>
        </footer>
    </div>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const verifyIcon = document.getElementById('verifyIcon');
        const verifyTitle = document.getElementById('verifyTitle');
        const verifyMessage = document.getElementById('verifyMessage');
        const loginButton = document.getElementById('loginButton');

        if (!token) {
            verifyIcon.classList.add('error');
            verifyIcon.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
            verifyTitle.textContent = 'Invalid Verification Link';
            verifyMessage.textContent = 'The verification link is invalid or missing. Please check your email for the correct link or request a new verification email.';
            loginButton.style.display = 'inline-flex';
            loginButton.textContent = 'Back to Login';
        } else {
            fetch(`/api/auth/verify-email?token=${token}`)
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        verifyTitle.textContent = 'Email Verified Successfully!';
                        verifyMessage.textContent = data.message;
                        loginButton.style.display = 'inline-flex';
                    } else {
                        throw new Error(data.error || 'Verification failed');
                    }
                })
                .catch(error => {
                    verifyIcon.classList.add('error');
                    verifyIcon.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
                    verifyTitle.textContent = 'Verification Failed';
                    verifyMessage.textContent = error.message || 'The verification link is invalid or has expired. Please request a new verification email.';
                    loginButton.style.display = 'inline-flex';
                    loginButton.textContent = 'Back to Login';
                });
        }
    </script>
</body>
</html>
