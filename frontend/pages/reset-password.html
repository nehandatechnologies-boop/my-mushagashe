<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Mushagashe Vocational Training Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/design-system.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
        .reset-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--primary-50) 0%, var(--surface) 50%, var(--accent-50) 100%);
        }

        .reset-header {
            padding: var(--space-6) var(--space-8);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-text h1 {
            font-size: var(--text-base);
            font-weight: var(--font-bold);
            color: var(--text-primary);
            line-height: var(--leading-tight);
        }

        .logo-text p {
            font-size: var(--text-xs);
            color: var(--text-secondary);
        }

        .reset-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-12) var(--space-8);
        }

        .reset-container {
            max-width: 480px;
            width: 100%;
        }

        .reset-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            padding: var(--space-8);
        }

        .reset-card-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .reset-card-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary-400), var(--primary-600));
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-4);
            color: var(--text-inverse);
        }

        .reset-card-title {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .reset-card-subtitle {
            font-size: var(--text-sm);
            color: var(--text-secondary);
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: var(--space-2);
            border-radius: var(--radius-md);
            transition: color var(--transition-base);
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        .error-message {
            display: none;
            padding: var(--space-3) var(--space-4);
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            border-radius: var(--radius-lg);
            color: var(--danger);
            font-size: var(--text-sm);
            margin-bottom: var(--space-6);
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            display: none;
            padding: var(--space-3) var(--space-4);
            background: var(--success-bg);
            border: 1px solid var(--success);
            border-radius: var(--radius-lg);
            color: var(--success);
            font-size: var(--text-sm);
            margin-bottom: var(--space-6);
        }

        .success-message.show {
            display: block;
        }

        .btn-loading {
            position: relative;
            pointer-events: none;
            opacity: 0.7;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: var(--radius-full);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .reset-footer {
            padding: var(--space-6) var(--space-8);
            background: var(--gray-50);
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .footer-text {
            font-size: var(--text-sm);
            color: var(--text-secondary);
        }

        @media (max-width: 640px) {
            .reset-header {
                padding: var(--space-4) var(--space-6);
            }

            .reset-main {
                padding: var(--space-8) var(--space-6);
            }

            .reset-card {
                padding: var(--space-6);
            }

            .reset-card-title {
                font-size: var(--text-xl);
            }
        }
    </style>
</head>
<body>
    <div class="reset-page">
        <header class="reset-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <img src="../assets/images/mushagashe-logo.jpg" alt="Mushagashe VTC Logo">
                    </div>
                    <div class="logo-text">
                        <h1>Mushagashe VTC</h1>
                        <p>Student Portal</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="reset-main">
            <div class="reset-container">
                <div class="reset-card">
                    <div class="reset-card-header">
                        <div class="reset-card-icon">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <h2 class="reset-card-title">Reset Your Password</h2>
                        <p class="reset-card-subtitle">Enter your new password below</p>
                    </div>

                    <form id="resetPasswordForm">
                        <div class="form-group">
                            <label class="form-label required" for="new_password">New Password</label>
                            <div class="password-input-wrapper">
                                <input 
                                    type="password" 
                                    id="new_password" 
                                    name="new_password" 
                                    class="input"
                                    placeholder="Enter new password" 
                                    required
                                    minlength="6"
                                >
                                <button type="button" class="password-toggle" onclick="togglePassword('new_password')" aria-label="Toggle password visibility">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label required" for="confirm_password">Confirm Password</label>
                            <div class="password-input-wrapper">
                                <input 
                                    type="password" 
                                    id="confirm_password" 
                                    name="confirm_password" 
                                    class="input"
                                    placeholder="Confirm new password" 
                                    required
                                    minlength="6"
                                >
                                <button type="button" class="password-toggle" onclick="togglePassword('confirm_password')" aria-label="Toggle password visibility">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-full" id="resetBtn">
                            <span class="btn-text">Reset Password</span>
                        </button>
                    </form>

                    <div id="error-message" class="error-message"></div>
                    <div id="success-message" class="success-message"></div>
                    
                    <div style="text-align: center; margin-top: var(--space-6);">
                        <a href="student-login.html" style="color: var(--primary-600); text-decoration: none; font-size: var(--text-sm); font-weight: var(--font-medium);">
                            Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="reset-footer">
            <p class="footer-text">Mushagashe Vocational Training Centre</p>
            <p class="footer-text">&copy; <span id="current-year"></span> All Rights Reserved</p>
        </footer>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;
            const icon = button.querySelector('svg');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        document.getElementById('current-year').textContent = new Date().getFullYear();

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const resetBtn = document.getElementById('resetBtn');
        const btnText = resetBtn.querySelector('.btn-text');
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');

        if (!token) {
            errorDiv.textContent = 'Invalid or missing reset token. Please request a new password reset link.';
            errorDiv.classList.add('show');
            resetBtn.disabled = true;
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.add('show');
                successDiv.classList.remove('show');
                return;
            }

            if (newPassword.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.classList.add('show');
                successDiv.classList.remove('show');
                return;
            }
            
            resetBtn.classList.add('btn-loading');
            btnText.textContent = 'Resetting...';
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    successDiv.textContent = data.message;
                    successDiv.classList.add('show');
                    setTimeout(() => {
                        window.location.href = 'student-login.html';
                    }, 2000);
                } else {
                    errorDiv.textContent = data.error || 'Password reset failed. Please try again.';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please check your connection and try again.';
                errorDiv.classList.add('show');
            } finally {
                resetBtn.classList.remove('btn-loading');
                btnText.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
